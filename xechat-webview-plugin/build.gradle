plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
}

group 'cn.xeblog'
version '2.0.0-beta'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// 将 xechat-commons 源码直接纳入编译，改一处立刻生效，无需 mvn install
sourceSets {
    main {
        java {
            srcDirs += ['../xechat-commons/src/main/java']
        }
    }
}

ext {
    xechatCommonsVersion = '2.0.0'
    lombokVersion = '1.18.34'
    jxBrowserVersion = '7.22'
    gsonVersion = '2.13.2'
    junitVersion = '4.13.2'
    hutoolVersion = '5.8.32'
    nettyVersion = '4.1.77.Final'
    protostuffVersion = '1.8.0'
    lunarVersion = '1.2.24'
}

repositories {
    maven {
        url 'file:///E:/maven/repository'
    }
    maven {
        url 'https://maven.aliyun.com/nexus/content/groups/public/'
    }
    mavenLocal()
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity('2025.2')
        bundledPlugins(['com.intellij.java'])
    }

    testImplementation "junit:junit:$junitVersion"

    // xechat-commons：源码直接纳入编译，无需 mvn install
    // Netty（xechat-commons 协议层依赖）
    implementation "io.netty:netty-all:$nettyVersion"
    // Protostuff（xechat-commons 序列化依赖）
    implementation "io.protostuff:protostuff-core:$protostuffVersion"
    implementation "io.protostuff:protostuff-runtime:$protostuffVersion"
    // lunar（农历工具，xechat-commons 依赖）
    implementation "cn.6tail:lunar:$lunarVersion"
    // logback：仅编译时需要，运行时由 IDEA 自带的 SLF4J 绑定接管
    compileOnly "ch.qos.logback:logback-classic:1.2.11"

    // JxBrowser：compileOnly，运行时从 CDN 动态下载到插件目录加载
    compileOnly "com.teamdev.jxbrowser:jxbrowser:$jxBrowserVersion"
    compileOnly "com.teamdev.jxbrowser:jxbrowser-swing:$jxBrowserVersion"
    compileOnly "com.teamdev.jxbrowser:jxbrowser-win64:$jxBrowserVersion"
    compileOnly "com.teamdev.jxbrowser:jxbrowser-linux64:$jxBrowserVersion"
    compileOnly "com.teamdev.jxbrowser:jxbrowser-mac:$jxBrowserVersion"

    implementation "com.google.code.gson:gson:$gsonVersion"
    implementation("cn.hutool:hutool-all:$hutoolVersion") {
        exclude group: 'org.slf4j', module: 'slf4j-log4j12'
        exclude group: 'org.slf4j', module: 'log4j-over-slf4j'
        exclude group: 'log4j', module: 'log4j'
        exclude group: 'ch.qos.reload4j', module: 'reload4j'
    }

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

intellijPlatform {
    buildSearchableOptions = false

    pluginConfiguration {
        ideaVersion {
            sinceBuild = '233'
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

// 每次 runIde 前清空沙箱 IDEA 日志（idea.log），避免多次运行日志膨胀
tasks.named('runIde') {
    doFirst {
        def sandboxDir = file("${projectDir}/../.intellijPlatform/sandbox/${project.name}")
        if (sandboxDir.exists()) {
            fileTree(sandboxDir) {
                include '*/log/idea.log'
            }.each { logFile ->
                logFile.delete()
                println "[runIde] 已清空日志: ${logFile}"
            }
        }
    }
}

// 将 Vue 打包产物复制到插件资源目录
task copyWebDist(type: Copy) {
    from "${projectDir}/../web/dist"
    into "${projectDir}/src/main/resources/web"
    dependsOn ':web:build'
}

// 排除 JxBrowser JAR 不打包进插件分发
prepareSandbox {
    from("${projectDir}/../web/dist") {
        into "${project.name}/web"
    }
}
