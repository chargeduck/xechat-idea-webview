<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xechat</title>
    <style>
        body { margin:0; overflow:hidden; background:#1e1e1e; color:#ccc; font-family:sans-serif; }
        #error-box { display:none; padding:20px; color:#f56c6c; white-space:pre-wrap; font-size:13px; }
    </style>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var app = document.getElementById('app');
            var box = document.getElementById('error-box');
            box.style.display = 'block';
            box.textContent = 'JS Error: ' + msg + '\\nFile: ' + url + '\\nLine: ' + line + ':' + col;
            if (error && error.stack) box.textContent += '\\n\\nStack:\\n' + error.stack;
            app.innerHTML = '';
            app.appendChild(box);
            return true;
        };
    </script>
</head>
<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#888;font-size:14px;">
            加载中...
        </div>
    </div>
    <div id="error-box"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
